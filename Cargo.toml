[package]
name = "sorsa-crm-watcher"
version = "0.1.0"
edition = "2021"
authors = ["Sorosjenaka"]
description = "Local Social CRM & DOM State Tracker for Sorsa Extension and X with Anti-Duplication Golden Rules"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = { version = "7.1" }
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.24" }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
colored = "2.1"
