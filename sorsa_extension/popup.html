<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 360px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0e17; color: #c8d6e5; min-height: 200px; overflow-x: hidden; }
.app { padding: 14px; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #1a2232; }
.brand { display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg, #00c9a7 0%, #00a388 100%); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #0a0e17; letter-spacing: -0.5px; font-family: 'SF Mono', 'Fira Code', monospace; }
.brand-name { font-size: 16px; font-weight: 800; color: #e8f0f8; letter-spacing: -0.3px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.lang-btn { width: 22px; height: 22px; border-radius: 4px; border: 2px solid #1a2232; cursor: pointer; padding: 0; overflow: hidden; background: none; transition: border-color 0.2s; }
.lang-btn:hover { border-color: #2a3a52; }
.lang-btn.active { border-color: #00c9a7; }
.lang-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.status-pill { display: flex; align-items: center; gap: 6px; background: rgba(0, 201, 167, 0.1); border: 1px solid rgba(0, 201, 167, 0.25); padding: 4px 10px; border-radius: 20px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #00c9a7; box-shadow: 0 0 6px rgba(0, 201, 167, 0.6); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.status-text { font-size: 9px; font-weight: 700; color: #00c9a7; text-transform: uppercase; letter-spacing: 1px; }
.permission-banner { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: none; flex-direction: column; gap: 8px; }
.permission-banner p { font-size: 11px; color: #fca5a5; font-weight: 500; line-height: 1.4; }
.btn-grant { background: #00c9a7; color: #0a0e17; border: none; padding: 5px 12px; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; width: fit-content; }
.btn-grant:hover { background: #00ddb5; }
.tabs { display: flex; gap: 2px; margin-bottom: 14px; background: #111827; border-radius: 8px; padding: 3px; border: 1px solid #1a2232; }
.tab { flex: 1; padding: 7px 4px; font-size: 11px; font-weight: 600; border: none; background: none; cursor: pointer; color: #4a5568; border-radius: 6px; transition: all 0.2s; }
.tab.active { color: #e8f0f8; background: #1a2232; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.section { margin-bottom: 12px; }
.toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle-item { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 90px; background: #111827; border: 1px solid #1a2232; border-radius: 8px; padding: 8px 10px; cursor: pointer; user-select: none; transition: border-color 0.2s; }
.toggle-item:hover { border-color: #2a3a52; }
.toggle-item input { display: none; }
.toggle-check { width: 16px; height: 16px; border-radius: 4px; background: #1a2232; border: 1px solid #2a3a52; position: relative; flex-shrink: 0; transition: all 0.2s; }
.toggle-item input:checked + .toggle-check { background: #00c9a7; border-color: #00c9a7; }
.toggle-item input:checked + .toggle-check::after { content: ""; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #0a0e17; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.toggle-item span:last-child { font-size: 11px; font-weight: 600; color: #8899aa; }
.toggle-item input:checked ~ span:last-child { color: #c8d6e5; }
select { width: 100%; padding: 7px 10px; border: 1px solid #1a2232; border-radius: 7px; font-size: 11px; font-weight: 600; background: #111827; color: #c8d6e5; cursor: pointer; margin-bottom: 8px; }
select:focus { outline: none; border-color: #00c9a7; }
.btn-action { display: block; width: 100%; padding: 9px; font-size: 11px; font-weight: 700; border: none; border-radius: 7px; cursor: pointer; color: #fff; text-transform: uppercase; letter-spacing: 0.6px; transition: all 0.2s; }
.btn-action:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-start { background: linear-gradient(135deg, #00c9a7 0%, #00a388 100%); color: #0a0e17; }
.btn-pause { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); width: 48%; display: inline-block; }
.btn-stop { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); width: 48%; display: inline-block; }
.active-controls { display: none; gap: 4px; justify-content: center; }
.live-status { margin-top: 6px; font-size: 10px; min-height: 14px; text-align: center; color: #00c9a7; font-weight: 600; font-family: 'SF Mono', 'Consolas', monospace; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="logo-mark">PX</div>
      <span class="brand-name">Pizx Score</span>
    </div>
    <div class="header-right">
      <button class="lang-btn" data-lang="en" title="English"><img src="flags/en.png" alt="EN"></button>
      <button class="lang-btn active" data-lang="vi" title="Tiếng Việt"><img src="flags/vi.png" alt="VI"></button>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span class="status-text" data-i18n="statusActive">Đang bật</span>
      </div>
    </div>
  </div>

  <div id="permissionBanner" class="permission-banner">
    <p data-i18n="permText">Cần quyền truy cập Twitter/X để hiển thị điểm.</p>
    <button id="grantPermissionBtn" class="btn-grant" data-i18n="permBtn">Cấp quyền</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="display" data-i18n="tabDisplay">Hiển thị</button>
    <button class="tab" data-tab="scanner" data-i18n="tabScanner">Máy quét</button>
  </div>

  <div id="tab-display" class="tab-panel active">
    <div class="section">
      <div class="toggle-group">
        <label class="toggle-item">
          <input type="checkbox" id="showTS" checked>
          <span class="toggle-check"></span>
          <span data-i18n="toggleTS">TweetScout</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="showSorsa" checked>
          <span class="toggle-check"></span>
          <span data-i18n="toggleSorsa">Sorsa</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="showFollowers" checked>
          <span class="toggle-check"></span>
          <span data-i18n="toggleFlw">Followers</span>
        </label>
      </div>
    </div>
  </div>

  <div id="tab-scanner" class="tab-panel">
    <div class="section">
      <p style="font-size:10px;color:#4a5568;margin-bottom:8px;line-height:1.4;" data-i18n="scannerDesc">Tự động cuộn qua danh sách người theo dõi, thu thập điểm số, xuất ra file CSV.</p>
      <select id="scrollDir">
        <option value="1" data-i18n-opt="scrollDown">Cuộn xuống</option>
        <option value="-1" data-i18n-opt="scrollUp">Cuộn lên</option>
      </select>
      <button id="startBtn" class="btn-action btn-start" data-i18n="btnScan">Quét &amp; Xuất</button>
      <div id="activeControls" class="active-controls">
        <button id="pauseBtn" class="btn-action btn-pause" data-i18n="btnPause">Tạm dừng</button>
        <button id="resumeBtn" class="btn-action btn-start" style="display:none;width:48%;" data-i18n="btnResume">Tiếp tục</button>
        <button id="stopBtn" class="btn-action btn-stop" data-i18n="btnStop">Dừng</button>
      </div>
      <div id="liveStatus" class="live-status"></div>
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
